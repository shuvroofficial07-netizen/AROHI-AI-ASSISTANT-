name: Build & Test AROHI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkey -v -keystore ./debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create minimal .env if missing
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env || true
            echo "GEMINI_API_KEY=" >> .env
          fi

      - name: Run unit tests (pure-Kotlin core logic)
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest --stacktrace --no-daemon --console=plain 2>&1 | tee build-test.log
          echo "=== EXIT MARKER ===" >> build-test.log
          exit $(echo $?)

      - name: Build debug APK
        id: apkbuild
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee build-assemble.log
          status=${PIPESTATUS[0]}
          echo "exitcode=$status"
          echo "ASSEMBLE_EXIT=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Surface build result in job summary
        if: always()
        shell: bash
        run: |
          echo "## Build & Test result" >> "$GITHUB_STEP_SUMMARY"
          echo "Assemble exit: ${ASSEMBLE_EXIT:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build-assemble.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -nE "e: |error:|FAILED|What went wrong|> Task .*FAILED|Execution failed|Caused by|Manifest merger|AAPT|Duplicate|unresolved|expecting" build-assemble.log | tail -80 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify APK
        if: always()
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK built:"; ls -lh "$APK_PATH"
          else
            echo "APK not produced (see summary)."
          fi

      - name: Upload gradle console logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arohi-gradle-logs
          path: |
            build-test.log
            build-assemble.log
            app/build/reports/
            app/build/test-results/
