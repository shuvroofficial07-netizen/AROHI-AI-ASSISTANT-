name: Build & Test AROHI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkey -v -keystore ./debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create minimal .env if missing
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env || true
            echo "GEMINI_API_KEY=" >> .env
          fi

      - name: Run unit tests (pure-Kotlin core logic)
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi
          echo "APK built:"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arohi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arohi-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
